
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CNC Maintenance Checklist with Camera</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h2 { color: #2c3e50; }
        .task { margin-bottom: 30px; }
        label { font-weight: bold; }
        textarea { width: 100%; height: 60px; margin-top: 5px; }
        .preview { margin-top: 10px; max-width: 100%; height: auto; }
        button { margin-top: 5px; }
    </style>
</head>
<body>
    <h2>CNC Wood Cutting Machine Maintenance Checklist</h2>

    <div id="checklist"></div>

    <script>
        const tasks = [
            "Check compressor oil level and condition",
            "Drain moisture from air tank",
            "Clean air dryer filters",
            "Inspect controller cabinet",
            "Clean or replace air filters",
            "Inspect spindle and tool holder",
            "Clean cutting area and vacuum system",
            "Check lubrication system",
            "Run diagnostic test",
            "Verify emergency stop and safety interlocks"
        ];

        const checklistDiv = document.getElementById("checklist");

        tasks.forEach((task, index) => {
            const taskDiv = document.createElement("div");
            taskDiv.className = "task";
            taskDiv.innerHTML = `
                <label>
                    <input type="checkbox" onchange="updateTimestamp(${index})"> ${task}
                </label>
                <br>
                <small id="timestamp-${index}">Timestamp: Not completed</small>
                <br>
                <textarea placeholder="Notes..."></textarea>
                <br>
                <input type="file" accept="image/*" capture="environment" onchange="previewImage(event, ${index})">
                <br>
                <img id="preview-${index}" class="preview" src="" alt="Image preview">
            `;
            checklistDiv.appendChild(taskDiv);
        });

        function updateTimestamp(index) {
            const timestamp = new Date().toLocaleString();
            document.getElementById(`timestamp-${index}`).textContent = "Timestamp: " + timestamp;
        }

        function previewImage(event, index) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById(`preview-${index}`);
                output.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
